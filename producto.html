<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SouthSide x LVCK</title>
<meta name="description" content="SouthSide by LVCK — piezas de producción corta. Cae el 26 AGO 2026." />
<!-- Open Graph / share preview — same lockup as the landing -->
<meta property="og:type" content="website">

<link rel="canonical" href="https://southside-lvck.vercel.app/producto.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SouthSide — LVCK">
<meta name="twitter:description" content="LVCK returns with SouthSide — the drop that marks our new chapter. 26 AUG 2026.">
<meta name="twitter:image" content="https://southside-lvck.vercel.app/og-image.png?v=2">

<link rel="apple-touch-icon" href="favicon.png?v=9">
<script>
  (function () {
    if (location.hostname.indexOf("github.io") === -1) return;
    var rest = location.pathname.replace(/^\/[^/]+/, "") || "/";
    location.replace("https://southside-lvck.vercel.app" + rest + location.search + location.hash);
  })();
</script>
<meta name="theme-color" content="#F5F5F0">
<script>
  /* Runs before the stylesheet so the page never paints the wrong mode first.
     A stored choice wins; otherwise follow the device. */
  (function () {
    try {
      var t = localStorage.getItem("ss-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "dark" ? "#232320" : "#F5F5F0");
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(24px, 5vh, 56px) clamp(16px, 4vw, 48px) 0;
  }

  .crumb {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    display: inline-block;
    margin-bottom: clamp(20px, 4vh, 40px);
  }
  .crumb:hover { color: var(--ink); }

  .product {
    display: grid;
    /* image column trimmed ~30% (was 1.25fr) so the photo reads compact */
    grid-template-columns: minmax(0, 0.64fr) minmax(0, 1fr);
    gap: clamp(28px, 5vw, 72px);
    align-items: start;
  }
  @media (max-width: 860px) {
    .product { grid-template-columns: 1fr; }
    /* single column: cap the image so it's ~30% smaller and centred */
    .product .gallery { max-width: 72%; margin-inline: auto; }
  }

  /* ---------- gallery ---------- */
  .stage {
    position: relative;
    aspect-ratio: 4 / 5;
    background: var(--bone-deep);
    overflow: hidden;
    touch-action: pan-y;
    border-radius: clamp(14px, 2.5vw, 22px);
    border: 1px solid var(--glass-edge);
  }
  /* trim only the main photo a touch on desktop; thumbnails keep their size.
     (on mobile the image is already reduced by the gallery cap, so leave it.) */
  @media (min-width: 861px) { .stage { max-width: 84%; } }
  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.7s var(--ease), transform 0.5s var(--ease);
  }
  .stage img.on { opacity: 1; }

  /* 360° spin */
  .spin-toggle {
    position: absolute; z-index: 6; right: 10px; bottom: 10px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px 7px 10px;
    border: 1px solid var(--glass-edge); border-radius: 999px;
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    color: var(--ink); font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.1em;
    cursor: pointer; transition: border-color 0.2s var(--ease), transform 0.2s var(--ease), background 0.2s var(--ease), color 0.2s var(--ease);
  }
  .spin-toggle:hover { border-color: var(--ink); transform: translateY(-1px); }
  .spin-toggle svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .spin-toggle.loading { opacity: 0.55; pointer-events: none; }
  .stage.spinning .spin-toggle { background: var(--ink); color: var(--bone); border-color: var(--ink); }
  .stage.spinning { cursor: ew-resize; }
  .spin-frame {
    position: absolute; inset: 0; z-index: 4; display: none;
    width: 100%; height: 100%; object-fit: contain;
    background: var(--bone-deep);
    cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none;
  }

  /* receiving end of the shop→product shared-element morph: the visible photo
     carries the same transition name as the centred coverflow garment, so the
     browser grows one into the other. Only the .on image is named (unique). */
  @media (prefers-reduced-motion: no-preference) {
    .stage img.on { view-transition-name: ss-hero; }
  }
  /* the pointer becomes a loupe: the image scales around wherever it sits */
  .stage.zoom img.on { transform: scale(1.6); transition: transform 0.15s linear, opacity 0.7s var(--ease); }

  .thumbs {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .thumbs button {
    flex: 0 0 auto;
    width: 74px;
    aspect-ratio: 4 / 5;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--bone-deep);
    cursor: pointer;
    overflow: hidden;
    opacity: 0.55;
    transition: opacity 0.3s var(--ease), border-color 0.3s var(--ease);
  }
  .thumbs button img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs button.on,
  .thumbs button:hover { opacity: 1; border-color: var(--ink); }

  .zoom-note {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- info column ---------- */
  @media (min-width: 861px) {
    /* clears the sticky header + countdown strip above it */
    .info { position: sticky; top: 148px; }
  }
  .info h1 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    /* eased down a touch so the info reads as composed as the (smaller) photo */
    font-size: clamp(22px, 2.9vw, 33px);
    letter-spacing: 0.03em;
    line-height: 1.15;
  }
  .info .tagline { margin-top: 10px; font-size: 15px; color: var(--muted); }
  /* Playfair AND Cinzel render old-style numerals here (uneven heights, the "1"
     dropping to x-height), so a price read as mismatched digits. Times New Roman
     has uniform LINING figures (every digit the same height) and is already a
     brand face on the landing; tabular keeps the digit widths even. */
  .info .price {
    margin-top: 18px;
    font-family: 'Times New Roman', Times, serif;
    font-size: 22px;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  /* shipping line under the price — the cost for the selected country */
  .ship-line-info {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ship-line-info svg { width: 15px; height: 15px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.5; opacity: 0.85; }
  .ship-line-info b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* real shipping detail inside the "Envío" accordion (replaces the PENDING span) */
  .fact .ship-fact-eta { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; }
  .fact .ship-fact-note { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }

  .size-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: clamp(26px, 4vh, 38px) 0 12px;
  }
  .size-head .label { font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; }
  .size-head button {
    background: none; border: none; padding: 0; cursor: pointer;
    font: inherit; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); text-decoration: underline; text-underline-offset: 4px;
  }
  .size-head button:hover { color: var(--ink); }

  .sizes { display: flex; flex-wrap: wrap; gap: 9px; }
  .size {
    min-width: 52px;
    padding: 10px 13px;
    border: 1px solid var(--glass-edge);
    border-radius: 10px;
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: border-color 0.25s var(--ease), background 0.25s var(--ease), color 0.25s var(--ease);
  }
  .size:hover { border-color: var(--ink); }
  .size.on { background: var(--ink); color: var(--bone); border-color: var(--ink); }
  .size.sold {
    opacity: 0.34;
    cursor: not-allowed;
    text-decoration: line-through;
    pointer-events: none;
  }
  .size.pending { opacity: 0.45; pointer-events: none; }   /* stock not known yet */

  .buy { margin-top: 24px; }
  /* shrink the tribal CTA (Elige / Comprar); centred in the info column */
  .btn.buy { width: clamp(150px, 44%, 186px); margin-inline: auto; }
  .secure {
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    line-height: 1.6;
  }

  /* subtle text trigger under the sizes */
  .rec-link {
    align-self: flex-start;
    margin-top: 12px;
    background: none; border: none; padding: 0;
    color: var(--muted);
    font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer;
    border-bottom: 1px solid var(--hairline);
    transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  .rec-link:hover { color: var(--ink); border-color: var(--ink); }

  /* ---------- size recommender modal (reuses .sheet glass) ---------- */
  .rec-row { display: flex; gap: 12px; margin-bottom: 18px; }
  .rec-field { flex: 1; display: flex; flex-direction: column; gap: 7px; text-align: left; }
  .rec-field span { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .rec-field input {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--glass-edge); border-radius: 10px;
    background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--ink); font-family: 'Playfair Display', serif; font-size: 16px; text-align: center;
  }
  .rec-field input:focus { outline: none; border-color: var(--ink); }
  .rec-fitlab { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-align: left; margin-bottom: 9px; }
  .rec-fits { display: flex; gap: 8px; margin-bottom: 20px; }
  .rec-fit {
    flex: 1; padding: 11px 6px;
    border: 1px solid var(--glass-edge); border-radius: 10px;
    background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--muted); font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; cursor: pointer;
    transition: background 0.2s var(--ease), color 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  .rec-fit.on { background: var(--ink); color: var(--bone); border-color: var(--ink); }
  .rec-go { margin-top: 2px; }
  .rec-result { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--hairline); }
  .rec-lead { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
  .rec-reslabel { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .rec-size { font-family: 'Cinzel', serif; font-size: clamp(34px, 8vw, 52px); line-height: 1; color: var(--ink); }
  .rec-apply {
    display: block; margin: 16px auto 0; padding: 12px 26px;
    border: 1px solid var(--ink); border-radius: 999px; background: none;
    color: var(--ink); font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; cursor: pointer; transition: background 0.2s var(--ease), color 0.2s var(--ease);
  }
  .rec-apply:hover { background: var(--ink); color: var(--bone); }
  .rec-note { font-size: 11px !important; line-height: 1.6; color: var(--muted); margin: 14px 0 0 !important; }
  .rec-warn { color: var(--pending); font-size: 13px !important; margin: 0 !important; }

  /* ---------- international shipping modal (reuses .sheet glass) ---------- */
  .ship-field { display: flex; flex-direction: column; gap: 6px; text-align: left; margin-bottom: 12px; }
  .ship-field span { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .ship-input {
    width: 100%; padding: 11px 13px;
    border: 1px solid var(--glass-edge); border-radius: 10px;
    background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--ink); font-family: 'Playfair Display', serif; font-size: 15px;
  }
  .ship-input:focus { outline: none; border-color: var(--ink); }
  select.ship-input { cursor: pointer; }
  .ship-calc { margin-top: 4px; }
  .ship-result { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hairline); }
  .ship-line { display: flex; align-items: baseline; justify-content: space-between; font-size: 15px; }
  .ship-note { font-size: 11px !important; line-height: 1.6; color: var(--muted); margin: 10px 0 0 !important; }
  .ship-warn { color: var(--pending); font-size: 13px !important; margin: 0 !important; }
  .ship-pay { margin-top: 16px; }

  /* ---------- accordion ---------- */
  .facts { margin-top: clamp(30px, 5vh, 44px); border-top: 1px solid var(--hairline); }
  .fact { border-bottom: 1px solid var(--hairline); }
  .fact > button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 17px 0;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
    text-align: left;
  }
  .fact > button .sign { font-size: 17px; line-height: 1; transition: transform 0.35s var(--ease); }
  .fact.open > button .sign { transform: rotate(45deg); }
  .fact .body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.4s var(--ease);
  }
  .fact.open .body { grid-template-rows: 1fr; }
  .fact .body > div { overflow: hidden; }
  .fact .body p {
    padding-bottom: 18px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--muted);
  }

  /* ---------- size guide ---------- */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--scrim);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s var(--ease);
  }
  .sheet.open { opacity: 1; pointer-events: auto; }
  /* the pop-up window as a rounded glass card */
  .sheet .panel {
    background: var(--glass-strong);
    border: 1px solid var(--glass-edge);
    border-radius: clamp(18px, 3vw, 26px);
    backdrop-filter: blur(30px) saturate(1.3);
    -webkit-backdrop-filter: blur(30px) saturate(1.3);
    box-shadow: 0 34px 66px -34px rgba(10, 10, 10, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    padding: clamp(22px, 4vw, 38px);
    width: min(560px, 100%);
    max-height: 86vh;
    overflow-y: auto;
  }
  .sheet h3 { font-family: 'Cinzel', serif; font-size: 19px; margin-bottom: 12px; }
  .sheet p { font-size: 14px; line-height: 1.65; color: var(--muted); margin-bottom: 18px; }
  /* rounded table shell */
  .sheet table {
    width: 100%; font-size: 14px;
    border-collapse: separate; border-spacing: 0;
    border: 1px solid var(--glass-edge); border-radius: 14px; overflow: hidden;
  }
  .sheet th, .sheet td {
    padding: 11px 12px;
    text-align: left;
    border-bottom: 1px solid var(--hairline);
  }
  .sheet tr:last-child th, .sheet tr:last-child td { border-bottom: none; }
  .sheet th {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    background: rgba(150, 150, 150, 0.08);
  }
  .sheet td.todo { color: var(--pending); }
  .sheet .close { display: flex; margin: 22px auto 0; }

  /* ---------- cross-sell ---------- */
  .also { max-width: 1180px; margin: clamp(64px, 11vh, 120px) auto 0; padding: 0 clamp(16px, 4vw, 48px); }
  .also h2 { font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; margin-bottom: 20px; color: var(--muted); }
  .also a { display: flex; gap: 20px; align-items: center; text-decoration: none; color: var(--ink); }
  .also img { width: clamp(96px, 16vw, 150px); aspect-ratio: 4/5; object-fit: cover; background: var(--bone-deep); border-radius: 12px; border: 1px solid var(--glass-edge); }
  .also .n { font-family: 'Cinzel', serif; font-size: clamp(17px, 2.4vw, 23px); }
  .also .p { font-family: 'Times New Roman', Times, serif; font-size: 15px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* secondary "add the set" action directly under the buy button */
  .buy-set-link {
    display: block; width: 100%; margin-top: 10px;
    padding: 13px 20px;
    border: 1px solid var(--hairline); border-radius: 12px;
    background: none; color: var(--ink);
    font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px;
    cursor: pointer;
    transition: border-color 0.2s var(--ease), color 0.2s var(--ease);
  }
  .buy-set-link:hover { border-color: var(--ink); }
  .buy-set-off { color: var(--muted); }

  /* "Completa el set" module (reuses .set-price-* + .size-chip from shop.css) */
  .set-mod-card { max-width: 640px; }
  .set-mod-partner { display: flex; gap: 20px; align-items: center; text-decoration: none; color: var(--ink); margin-bottom: 20px; }
  .set-mod-partner img { width: clamp(96px, 16vw, 150px); aspect-ratio: 4/5; object-fit: cover; background: var(--bone-deep); border-radius: 12px; border: 1px solid var(--glass-edge); }
  .set-mod-meta .n { font-family: 'Cinzel', serif; font-size: clamp(17px, 2.4vw, 23px); }
  .set-mod-meta .tl { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .set-mod-sizes { margin-bottom: 16px; }
  .set-mod-sizelbl { display: block; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
  .set-mod-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .set-module.need-partner-size .set-mod-chips { animation: setShake 0.4s var(--ease); }
  .set-module.need-partner-size .size-chip { border-color: var(--pending); }
  .size-chip.sold { opacity: 0.4; text-decoration: line-through; cursor: not-allowed; }
  .set-mod-price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .set-mod-add { padding: 15px 20px; border: 1px solid var(--ink); border-radius: 12px; background: var(--ink); color: var(--bone); font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 0.16em; font-size: 12px; cursor: pointer; transition: filter 0.2s var(--ease); }
  .set-mod-add:hover { filter: brightness(1.12); }

  .missing { max-width: 700px; margin: 18vh auto; padding: 0 24px; text-align: center; }
</style>
</head>
<body>

<div class="topbar glass">
  <header class="site-head">
    <button type="button" class="menu-btn" data-open-menu aria-label="Menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="mark" href="shop.html" aria-label="LVCK">
      <img src="logo-w.png" alt="LVCK">
    </a>
    <nav class="head-links">
      <button type="button" class="lang-flag-btn" data-open-lang aria-label="Idioma"></button>
    </nav>
  </header>
  <div class="countdown-bar">
    <span class="label" data-i18n="drop.label">Lanzamiento</span>
    <span class="clock"></span>
    <span class="date" data-i18n="drop.date">26 AGO 2026</span>
  </div>
</div>

<div class="wrap" id="wrap"></div>
<div class="also" id="also" hidden></div>

<footer class="site-foot">
  <div data-i18n="foot.brand">LVCK · South Side</div>
  <div data-i18n="foot.note">Bogotá, Colombia</div>
</footer>

<button type="button" class="theme-switch" id="ss-theme-btn" data-toggle-theme
        aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
  <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.4v2.6M12 19v2.6M4.4 12H1.8M22.2 12h-2.6M6.4 6.4 4.6 4.6M19.4 19.4l-1.8-1.8M17.6 6.4l1.8-1.8M4.6 19.4l1.8-1.8"/>

<!-- Speculation Rules: prerender the other product ("también te puede gustar")
     and the shop on hover intent, so moving between pieces is instant.
     Chromium-only; ignored elsewhere. -->
<script type="speculationrules">
{
  "prerender": [
    { "where": { "href_matches": "/producto.html*" }, "eagerness": "moderate" },
    { "where": { "href_matches": "/shop.html*" }, "eagerness": "moderate" }
  ]

<script src="shop-common.js"></script>
<script>
(function () {
  var wrap = document.getElementById("wrap");
  var alsoEl = document.getElementById("also");
  var product = null, allProducts = [], stock = null;
  var postLaunch = false;          // shop-config.postLaunch: false = launch price, true = post-launch
  var chosen = null;               // the size object the visitor picked
  var shopConfig = null;           // the whole shop-config (for sets + set discount)
  var partnerChosen = null;        // size chosen for the set partner in "Completa el set"

  // active USD price for a product (prices are USD-based; launch vs post-launch)
  function activeUsd(p) { return postLaunch ? p.priceUSDPost : p.priceUSD; }
  var shipCfg = null;              // shipping-config.json; null/intlEnabled:false = Colombia-only (current behaviour)

  // display names for the country <select> in the (dormant) international modal
  var COUNTRY_NAMES = {
    CO: "Colombia", US: "United States", MX: "México", BR: "Brasil", AR: "Argentina",
    CL: "Chile", PE: "Perú", EC: "Ecuador", UY: "Uruguay", PY: "Paraguay", BO: "Bolivia",
    CR: "Costa Rica", PA: "Panamá", GT: "Guatemala", DO: "Rep. Dominicana",
    ES: "España", FR: "Francia", DE: "Alemania", IT: "Italia", PT: "Portugal",
    NL: "Países Bajos", BE: "Bélgica", IE: "Irlanda", AT: "Austria", SE: "Suecia",
    DK: "Dinamarca", FI: "Finlandia", PL: "Polonia"
  };

  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  /* ---------- 360° spin ----------
     Drag the stage to rotate the garment. Real turntable frames come from
     product.spin (an array of frame image URLs in shop-config.json); until those
     exist, a placeholder turn is SYNTHESISED from the hero photo with a canvas
     "billboard" squash, so the engine is fully wired and demoable now — swap in
     real frames later and nothing else changes. */
  function synthSpin(src, n) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () {
        var scale = Math.min(1, 520 / im.naturalWidth);
        var w = Math.max(1, Math.round(im.naturalWidth * scale));
        var h = Math.max(1, Math.round(im.naturalHeight * scale));
        var c = document.createElement("canvas"); c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        var frames = [];
        for (var k = 0; k < n; k++) {
          var sx = Math.cos((k / n) * Math.PI * 2);   // -1..1 : a turntable "billboard"
          ctx.clearRect(0, 0, w, h);
          ctx.save();
          ctx.translate(w / 2, 0);
          ctx.scale(Math.max(0.08, Math.abs(sx)), 1);
          ctx.translate(-w / 2, 0);
          ctx.globalAlpha = 0.4 + 0.6 * Math.abs(sx);
          ctx.drawImage(im, 0, 0, w, h);
          ctx.restore();
          try { frames.push(c.toDataURL("image/jpeg", 0.7)); }
          catch (e) { resolve(null); return; }        // tainted/again: give up quietly
        }
        resolve(frames);
      };
      im.onerror = function () { resolve(null); };
      im.src = src;
    });
  }

  function wireSpin(stage) {
    var FRAMES = 24;
    var real = Array.isArray(product.spin) && product.spin.length >= 2 ? product.spin : null;
    var frames = null, spinning = false, building = false, idx = 0, layer = null;

    var toggle = el("button", "spin-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-label", "360°");
    toggle.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.2-5.7" stroke-linecap="round"/>' +
      '<path d="M5 3.2V6.4h3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>360°</span>';
    toggle.addEventListener("click", function () { spinning ? exitSpin() : enterSpin(); });
    stage.appendChild(toggle);

    function enterSpin() {
      if (frames) return startSpin();
      if (real) { frames = real; return startSpin(); }
      if (building) return;
      building = true; toggle.classList.add("loading");
      synthSpin(product.photos[0].src, FRAMES).then(function (f) {
        building = false; toggle.classList.remove("loading");
        if (!f) { toggle.remove(); return; }   // no frames -> silently drop the feature
        frames = f; startSpin();
      });
    }
    function startSpin() {
      spinning = true;
      stage.classList.remove("zoom");
      stage.classList.add("spinning");
      if (!layer) { layer = el("img", "spin-frame"); layer.draggable = false; stage.appendChild(layer); }
      idx = 0; layer.src = frames[0]; layer.style.display = "block";
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      stage.addEventListener("pointerdown", onDown);
    }
    function exitSpin() {
      spinning = false;
      stage.classList.remove("spinning");
      if (layer) layer.style.display = "none";
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      stage.removeEventListener("pointerdown", onDown);
    }

    var dragging = false, lastX = 0;
    function onDown(e) { dragging = true; lastX = e.clientX; e.preventDefault(); }
    function onUp() { dragging = false; }
    function onMove(e) {
      if (!dragging || !frames) return;
      var steps = Math.round((e.clientX - lastX) / 6);
      if (!steps) return;
      idx = ((idx - steps) % frames.length + frames.length) % frames.length;  // drag right → turn
      layer.src = frames[idx];
      lastX = e.clientX;
    }
  }

  /* ---------- gallery ---------- */

  function buildGallery() {
    var col = el("div", "gallery");
    var stage = el("div", "stage");
    var thumbs = el("div", "thumbs");
    var lang = LVCK.getLang() || "es";

    product.photos.forEach(function (photo, i) {
      var img = new Image();
      img.src = photo.src;
      img.alt = photo.alt[lang] || photo.alt.es;
      img.dataset.i = i;
      img.loading = i === 0 ? "eager" : "lazy";
      if (i === 0) img.classList.add("on");
      stage.appendChild(img);

      var tb = el("button");
      tb.type = "button";
      tb.dataset.i = i;
      if (i === 0) tb.classList.add("on");
      var ti = new Image();
      ti.src = photo.src;
      ti.alt = "";
      ti.loading = "lazy";
      tb.appendChild(ti);
      tb.addEventListener("click", function () { show(i); });
      thumbs.appendChild(tb);
    });

    var index = 0;
    function show(next) {
      index = (next + product.photos.length) % product.photos.length;
      stage.querySelectorAll("img").forEach(function (img) {
        img.classList.toggle("on", Number(img.dataset.i) === index);
      });
      thumbs.querySelectorAll("button").forEach(function (b) {
        b.classList.toggle("on", Number(b.dataset.i) === index);
      });
    }

    /* Loupe: scale the active image and move its origin with the pointer, so
       the visitor can actually inspect the print and the stitching — the one
       thing a photo can't do that a fitting room can. Skipped on touch, where
       the same gesture means "swipe". */
    stage.addEventListener("mouseenter", function () { if (!stage.classList.contains("spinning")) stage.classList.add("zoom"); });
    stage.addEventListener("mouseleave", function () {
      stage.classList.remove("zoom");
      stage.querySelectorAll("img").forEach(function (img) { img.style.transformOrigin = "center"; });
    });
    stage.addEventListener("mousemove", function (e) {
      if (stage.classList.contains("spinning")) return;
      var r = stage.getBoundingClientRect();
      var x = ((e.clientX - r.left) / r.width) * 100;
      var y = ((e.clientY - r.top) / r.height) * 100;
      var on = stage.querySelector("img.on");
      if (on) on.style.transformOrigin = x + "% " + y + "%";
    });

    var startX = null;
    stage.addEventListener("touchstart", function (e) { if (!stage.classList.contains("spinning")) startX = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener("touchend", function (e) {
      if (startX === null || stage.classList.contains("spinning")) { startX = null; return; }
      var dx = e.changedTouches[0].clientX - startX;
      startX = null;
      if (Math.abs(dx) > 40) show(index + (dx < 0 ? 1 : -1));
    }, { passive: true });

    wireSpin(stage);
    col.appendChild(stage);
    if (product.photos.length > 1) col.appendChild(thumbs);

    var note = el("div", "zoom-note");
    note.setAttribute("data-i18n", "shop.swipeHint");
    col.appendChild(note);

    return col;
  }

  // name is per-language ({es,en,pt}); tolerate a plain string too
  function nameOf(p, lang) { var n = p.name; return (n && typeof n === "object") ? (n[lang] || n.es) : n; }

  /* ---------- buy column ---------- */

  function buildInfo() {
    var lang = LVCK.getLang() || "es";
    var col = el("div", "info");

    var h1 = el("h1", null, nameOf(product, lang));
    h1.id = "pname";
    col.appendChild(h1);

    var tag = el("div", "tagline", product.tagline[lang] || product.tagline.es);
    tag.id = "tagline";
    col.appendChild(tag);

    var price = el("div", "price", LVCK.money(activeUsd(product), lang));
    price.id = "price";
    col.appendChild(price);

    // reference-price disclaimer, shown only when a non-COP currency is selected
    var pnote = el("div", "price-note"); pnote.id = "price-note"; pnote.hidden = true;
    col.appendChild(pnote);

    // shipping cost for the selected country (follows the currency selector);
    // filled/refreshed by refreshShipping()
    var sline = el("div", "ship-line-info"); sline.id = "ship-line"; sline.hidden = true;
    var sicon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    sicon.setAttribute("viewBox", "0 0 24 24");
    sicon.innerHTML = '<path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z"/><circle cx="7" cy="17" r="1.6"/><circle cx="17.5" cy="17" r="1.6"/>';
    var stext = el("span"); stext.id = "ship-line-text";
    sline.appendChild(sicon); sline.appendChild(stext);
    col.appendChild(sline);

    var head = el("div", "size-head");
    var label = el("span", "label");
    label.setAttribute("data-i18n", "p.choose");
    var guide = el("button", null);
    guide.type = "button";
    guide.setAttribute("data-i18n", "p.guide");
    guide.addEventListener("click", openGuide);
    head.appendChild(label);
    head.appendChild(guide);
    col.appendChild(head);

    var sizes = el("div", "sizes");
    sizes.id = "sizes";
    product.sizes.forEach(function (s) {
      var b = el("button", "size pending", s.size);
      b.type = "button";
      b.dataset.slug = s.slug;
      b.addEventListener("click", function () { choose(s); });
      sizes.appendChild(b);
    });
    col.appendChild(sizes);

    // size recommender trigger (opens the heuristic helper)
    var recLink = el("button", "rec-link");
    recLink.type = "button";
    recLink.setAttribute("data-i18n", "rec.open");
    recLink.addEventListener("click", openRec);
    col.appendChild(recLink);

    var buy = el("a", "btn btn-block buy is-disabled");
    buy.id = "buy";
    buy.rel = "noopener";
    LVCK.btnLabel(buy).textContent = LVCK.t("p.pickFirst", lang);
    buy.addEventListener("click", addChosenToCart);
    col.appendChild(buy);

    // quick "add the set" right under the button — opens the set sheet (both
    // sizes + the −% discount). Only when this garment belongs to a set.
    var setId = currentSetId();
    if (setId) {
      var setLink = el("button", "buy-set-link");
      setLink.type = "button";
      setLink.innerHTML = '<span data-i18n="set.add">' + LVCK.t("set.add", lang) + '</span><span class="buy-set-off"></span>';
      var off = setPct();
      if (off) setLink.querySelector(".buy-set-off").textContent = " · −" + off + "%";
      setLink.addEventListener("click", function () { LVCK.openSetSheet(setId); });
      col.appendChild(setLink);
    }

    var secure = el("div", "secure");
    secure.setAttribute("data-i18n", "p.secure");
    col.appendChild(secure);

    col.appendChild(buildFacts());
    return col;
  }

  function choose(size) {
    if (stock && stock[size.slug] === false) return;
    var buy = document.getElementById("buy");

    // tap the already-selected size again → deselect it, back to "Elige"
    if (chosen && chosen.slug === size.slug) {
      chosen = null;
      document.querySelectorAll("#sizes .size").forEach(function (b) { b.classList.remove("on"); });
      buy.classList.add("is-disabled");
      buy.removeAttribute("href");
      LVCK.btnLabel(buy).textContent = LVCK.t("p.pickFirst");
      return;
    }

    chosen = size;
    document.querySelectorAll("#sizes .size").forEach(function (b) {
      b.classList.toggle("on", b.dataset.slug === size.slug);
    });
    buy.classList.remove("is-disabled");
    buy.removeAttribute("href"); // the button now adds to cart; no direct link to follow
    LVCK.btnLabel(buy).textContent = LVCK.t("cart.add");
  }

  /* Add the chosen size to the shared cart and slide the drawer open. All
     checkout now happens from the cart (one Bold link for everything inside),
     so the product page's job ends at "added". */
  function addChosenToCart(e) {
    if (e) e.preventDefault();
    if (!chosen) return;
    var lang = LVCK.getLang() || "es";
    LVCK.cartAdd({ product: product.slug, size: chosen.slug, name: nameOf(product, lang), sizeLabel: chosen.size });
    LVCK.openCart();
    var buy = document.getElementById("buy");
    LVCK.btnLabel(buy).textContent = LVCK.t("cart.added", lang);
    setTimeout(function () {
      if (chosen && buy) LVCK.btnLabel(buy).textContent = LVCK.t("cart.add", lang);
    }, 1600);
  }

  /* Buy click. Asks our own /api/checkout to mint a Bold link and sends the
     shopper there. If Bold isn't configured yet the endpoint answers 503 and we
     fall through to the button's plain href (the old Stripe link), so the shop
     never stops working mid-switch. A sold-out size (409) is surfaced, not
     followed. */
  var checkingOut = false;
  function startCheckout(e) {
    if (!chosen) return;
    e.preventDefault();
    // International flow is DORMANT until shipping-config.intlEnabled is true (and
    // the keys exist). While off, this branch is skipped.
    if (shipCfg && shipCfg.intlEnabled) { openShip(); return; }
    // Colombia: collect a short shipping step (name + city + WhatsApp) before Bold
    // so the order can be dispatched; the exact address is confirmed later.
    if (shipCfg && shipCfg.domestic && shipCfg.domestic.collect) { openDom(); return; }
    goBold();
  }

  // The Colombia checkout: mint a Bold link and go. `address` (short: name/city/
  // whatsapp) rides along so the order is saved with who + where. Extracted so the
  // (dormant) international modal can reuse it for CO buyers without duplicating.
  function goBold(address) {
    if (checkingOut) return;
    var buy = document.getElementById("buy");
    var stripeFallback = buy.getAttribute("href");

    checkingOut = true;
    buy.classList.add("is-disabled");

    fetch("/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product: product.slug, size: chosen.slug, country: "CO", address: address || null })
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      if (res.status === 200 && res.body.url) {
        window.location.href = res.body.url; // to Bold's checkout
        return;
      }
      if (res.status === 503 && stripeFallback) {
        window.location.href = stripeFallback; // Bold not live yet → Stripe
        return;
      }
      checkingOut = false;
      buy.classList.remove("is-disabled");
      if (res.status === 409) {
        // mark the just-chosen size sold out
        var b = document.querySelector('#sizes .size[data-slug="' + chosen.slug + '"]');
        if (b && !b.classList.contains("sold")) {
          b.classList.add("sold");
          b.textContent = b.textContent.split(" ")[0] + " · " + LVCK.t("p.soldOut");
        }
        resetBuy();
      }
    }).catch(function () {
      // network error: fall back to Stripe rather than dead-end the sale
      if (stripeFallback) { window.location.href = stripeFallback; return; }
      checkingOut = false;
      buy.classList.remove("is-disabled");
    });
  }

  /* Everything here is copy the brand still owes us. Rather than invent
     shipping times or a returns window — the two things a customer is most
     likely to hold us to — each panel says plainly that it is pending. */
  var FACT_KEYS = ["p.desc", "p.materials", "p.shipping", "p.returns"];
  var FACT_TODO = {
    "p.desc": { es: "PENDIENTE · describir la prenda, el corte y el fit",
                en: "PENDING · describe the piece, the cut and the fit",
                pt: "PENDENTE · descrever a peça, o corte e o caimento" },
    "p.materials": { es: "PENDIENTE · composición de la tela y cómo lavarla",
                     en: "PENDING · fabric composition and how to wash it",
                     pt: "PENDENTE · composição do tecido e como lavar" },
    "p.shipping": { es: "PENDIENTE · a qué países, cuánto cuesta y en cuántos días llega",
                    en: "PENDING · which countries, what it costs, how many days",
                    pt: "PENDENTE · para quais países, quanto custa e em quantos dias" },
    "p.returns": { es: "PENDIENTE · si aceptas cambios y dentro de cuántos días",
                   en: "PENDING · whether exchanges are accepted, and the window",
                   pt: "PENDENTE · se aceita trocas e em quantos dias" }
  };

  function buildFacts() {
    var facts = el("div", "facts");
    FACT_KEYS.forEach(function (key) {
      var item = el("div", "fact");
      var btn = el("button");
      btn.type = "button";
      var t = el("span");
      t.setAttribute("data-i18n", key);
      btn.appendChild(t);
      btn.appendChild(el("span", "sign", "+"));
      btn.addEventListener("click", function () { item.classList.toggle("open"); });

      var body = el("div", "body");
      var inner = el("div");
      if (key === "p.shipping") {
        // real shipping info (cost for the selected country), filled by
        // refreshShipping() — not a PENDING placeholder
        var sf = el("p"); sf.id = "ship-fact";
        inner.appendChild(sf);
      } else {
        var p = el("p", "todo");
        p.dataset.todo = key;
        p.appendChild(el("span", "pending", FACT_TODO[key][LVCK.getLang() || "es"]));
        inner.appendChild(p);
      }
      body.appendChild(inner);

      item.appendChild(btn);
      item.appendChild(body);
      facts.appendChild(item);
    });
    return facts;
  }

  /* ---------- size guide ---------- */

  function openGuide() { document.getElementById("guide").classList.add("open"); }
  function closeGuide() { document.getElementById("guide").classList.remove("open"); }

  function openRec() { document.getElementById("rec").classList.add("open"); }
  function closeRec() { document.getElementById("rec").classList.remove("open"); }

  /* ---------- size recommender (simple heuristic, no API) ----------
     Weight sets the base size, BMI nudges it for build, and the fit preference
     shifts one step (fitted -1 / loose +1). The cut is boxy/relaxed, so the copy
     tells people this is an estimate and to size up if between two. Refine the
     thresholds once the real cm measurements land. */
  function recommendIndex(h, w, fit, n) {
    var i = w < 55 ? 0 : w < 65 ? 1 : w < 78 ? 2 : w < 90 ? 3 : 4;   // base from weight
    if (h > 0) {
      var bmi = w / Math.pow(h / 100, 2);
      if (bmi >= 27) i += 1; else if (bmi <= 18.5) i -= 1;           // build nudge
    }
    if (fit === "slim") i -= 1; else if (fit === "loose") i += 1;    // fit preference
    return Math.max(0, Math.min(n - 1, i));
  }

  function buildRec() {
    var sheet = el("div", "sheet rec-sheet");
    sheet.id = "rec";
    var panel = el("div", "panel");

    var h3 = el("h3"); h3.setAttribute("data-i18n", "rec.title"); panel.appendChild(h3);
    var sub = el("p"); sub.setAttribute("data-i18n", "rec.sub"); panel.appendChild(sub);

    var saved = {};
    try { saved = JSON.parse(localStorage.getItem("ss-rec") || "{}"); } catch (e) {}

    function field(key, id, val) {
      var wrap = el("label", "rec-field");
      var lab = el("span"); lab.setAttribute("data-i18n", key); wrap.appendChild(lab);
      var input = el("input"); input.type = "number"; input.id = id; input.inputMode = "numeric";
      if (val) input.value = val;
      wrap.appendChild(input);
      return wrap;
    }
    var row = el("div", "rec-row");
    row.appendChild(field("rec.height", "rec-h", saved.h));
    row.appendChild(field("rec.weight", "rec-w", saved.w));
    panel.appendChild(row);

    var fitLab = el("div", "rec-fitlab"); fitLab.setAttribute("data-i18n", "rec.fit"); panel.appendChild(fitLab);
    var fitRow = el("div", "rec-fits");
    var fit = saved.fit || "reg";
    [["slim", "rec.fit.slim"], ["reg", "rec.fit.reg"], ["loose", "rec.fit.loose"]].forEach(function (f) {
      var b = el("button", "rec-fit" + (f[0] === fit ? " on" : ""));
      b.type = "button"; b.dataset.fit = f[0]; b.setAttribute("data-i18n", f[1]);
      b.addEventListener("click", function () {
        fit = f[0];
        fitRow.querySelectorAll(".rec-fit").forEach(function (x) { x.classList.toggle("on", x.dataset.fit === fit); });
      });
      fitRow.appendChild(b);
    });
    panel.appendChild(fitRow);

    var cta = el("button", "lang-btn rec-go"); cta.type = "button"; cta.setAttribute("data-i18n", "rec.cta");
    panel.appendChild(cta);

    var result = el("div", "rec-result"); result.hidden = true; panel.appendChild(result);

    cta.addEventListener("click", function () {
      var h = parseFloat(document.getElementById("rec-h").value);
      var w = parseFloat(document.getElementById("rec-w").value);
      if (!(w > 0)) { result.hidden = false; result.innerHTML = ""; result.appendChild(el("p", "rec-warn", LVCK.t("rec.incomplete"))); return; }
      try { localStorage.setItem("ss-rec", JSON.stringify({ h: h || "", w: w, fit: fit })); } catch (e) {}
      var idx = recommendIndex(h || 0, w, fit, product.sizes.length);
      var size = product.sizes[idx];

      result.hidden = false;
      result.innerHTML = "";
      var lead = el("div", "rec-lead");
      lead.appendChild(el("span", "rec-reslabel", LVCK.t("rec.result")));
      lead.appendChild(el("span", "rec-size", size.size));
      result.appendChild(lead);
      var apply = el("button", "rec-apply"); apply.type = "button"; apply.setAttribute("data-i18n", "rec.apply");
      apply.addEventListener("click", function () { choose(size); closeRec(); });
      result.appendChild(apply);
      result.appendChild(el("p", "rec-note", LVCK.t("rec.note")));
      LVCK.applyI18n(result);
    });

    var close = el("button", "btn close"); close.type = "button";

  /* ---------- "Completa el set" (jacket + jean of the same colorway) ----------
     Replaces the old generic cross-sell. Shows the current product's set partner
     with its own size picker and a discounted set price; "Agregar el set" drops
     BOTH garments into the cart (the −% applies in the drawer, and the server
     recomputes it so Bold charges the same). */
  function partnerProduct() {
    if (!shopConfig || !product) return null;
    var sets = shopConfig.sets || [];
    for (var i = 0; i < sets.length; i++) {
      var m = sets[i].members || [];
      if (m.indexOf(product.slug) !== -1) {
        var other = m.filter(function (s) { return s !== product.slug; })[0];
        return allProducts.filter(function (p) { return p.slug === other; })[0] || null;
      }
    }
    return null;
  }
  function setPct() { return Number(shopConfig && shopConfig.setDiscountPct) || 0; }
  function currentSetId() {
    if (!shopConfig || !product) return null;
    var sets = shopConfig.sets || [];
    for (var i = 0; i < sets.length; i++) if ((sets[i].members || []).indexOf(product.slug) !== -1) return sets[i].id;
    return null;
  }

  function buildSetModule() {
    var partner = partnerProduct();
    if (!partner) { alsoEl.hidden = true; return; }
    var lang = LVCK.getLang() || "es";
    alsoEl.hidden = false;
    alsoEl.className = "also set-module";
    alsoEl.innerHTML = "";

    var h2 = el("h2", null, LVCK.t("set.title", lang));
    alsoEl.appendChild(h2);

    var card = el("div", "set-mod-card");

    var a = el("a", "set-mod-partner");
    a.href = "producto.html?p=" + encodeURIComponent(partner.slug);
    a.setAttribute("data-reveal", "up");
    var img = new Image();
    img.src = partner.photos[0].src;
    img.alt = partner.photos[0].alt[lang] || partner.photos[0].alt.es;
    img.loading = "lazy";
    a.appendChild(img);
    var meta = el("div", "set-mod-meta");
    meta.appendChild(el("div", "n", nameOf(partner, lang)));
    meta.appendChild(el("div", "tl", partner.tagline[lang] || partner.tagline.es));
    a.appendChild(meta);
    card.appendChild(a);

    var szWrap = el("div", "set-mod-sizes");
    szWrap.appendChild(el("span", "set-mod-sizelbl", LVCK.t("set.pickPartnerSize", lang)));
    var chips = el("div", "set-mod-chips");
    partnerChosen = null;
    partner.sizes.forEach(function (s) {
      var b = el("button", "size-chip", s.size);

      b.addEventListener("click", function () {

        b.classList.add("on");
        alsoEl.classList.remove("need-partner-size");

    });
    szWrap.appendChild(chips);

    alsoEl.appendChild(card);

  // set price in the selected currency (orig → discounted → save), reactive to
  // country/currency like the rest of the page
  function refreshSetPrice() {
    var line = alsoEl.querySelector(".set-mod-price");
    var partner = partnerProduct();
    if (!line || !partner) return;
    var lang = LVCK.getLang() || "es";
    var ua = activeUsd(product), ub = activeUsd(partner), pct = setPct();
    var sel = LVCK.getSelectedCountry ? LVCK.getSelectedCountry() : null;
    var cc = sel ? (typeof sel === "string" ? sel : sel.c) : "co";
    var origStr, nowStr, saveStr;
    if (String(cc).toUpperCase() === "CO" && LVCK.copFromUsd) {
      var ca = LVCK.copFromUsd(ua), cb = LVCK.copFromUsd(ub);
      if (ca != null && cb != null) {
        var o = ca + cb, d = Math.round(pct / 100 * o);
        origStr = LVCK.fmtCOP(o, lang); nowStr = LVCK.fmtCOP(o - d, lang); saveStr = LVCK.fmtCOP(d, lang);
      }
    }
    if (!nowStr) {
      var oU = ua + ub, dU = Math.round(pct / 100 * oU);
      origStr = LVCK.money(oU, lang); nowStr = LVCK.money(oU - dU, lang); saveStr = LVCK.money(dU, lang);
    }
    line.innerHTML =
      '<span class="set-price-orig"></span><span class="set-price-now"></span><span class="set-price-save"></span>';
    line.querySelector(".set-price-orig").textContent = origStr;
    line.querySelector(".set-price-now").textContent = nowStr;
    line.querySelector(".set-price-save").textContent = LVCK.t("set.save", lang) + " " + saveStr;
  }

  // refresh the module's text + price in place on lang/currency change (keeps the
  // partner size the visitor already picked)
  function updateSetModule() {
    if (alsoEl.hidden || !alsoEl.querySelector(".set-mod-card")) return;
    var lang = LVCK.getLang() || "es";
    var partner = partnerProduct();
    if (!partner) return;
    var h2 = alsoEl.querySelector("h2"); if (h2) h2.textContent = LVCK.t("set.title", lang);
    var n = alsoEl.querySelector(".set-mod-meta .n"); if (n) n.textContent = nameOf(partner, lang);
    var tl = alsoEl.querySelector(".set-mod-meta .tl"); if (tl) tl.textContent = partner.tagline[lang] || partner.tagline.es;
    var lbl = alsoEl.querySelector(".set-mod-sizelbl"); if (lbl) lbl.textContent = LVCK.t("set.pickPartnerSize", lang);
    var add = alsoEl.querySelector(".set-mod-add"); if (add) add.textContent = LVCK.t("set.add", lang);
    refreshSetPrice();
  }

  function addSetToCart() {
    var partner = partnerProduct();
    if (!partner) return;
    var lang = LVCK.getLang() || "es";
    // need the current garment's size first — nudge the main picker
    if (!chosen) {
      var sizes = document.getElementById("sizes");
      if (sizes) sizes.scrollIntoView({ behavior: "smooth", block: "center" });
      var buy = document.getElementById("buy");
      if (buy) { buy.classList.remove("hint"); void buy.offsetWidth; buy.classList.add("hint"); }
      return;
    }
    if (!partnerChosen) { alsoEl.classList.add("need-partner-size"); return; }
    LVCK.cartAdd({ product: product.slug, size: chosen.slug, name: nameOf(product, lang), sizeLabel: chosen.size });
    LVCK.cartAdd({ product: partner.slug, size: partnerChosen.slug, name: nameOf(partner, lang), sizeLabel: partnerChosen.size });
    LVCK.openCart();
  }

  /* ---------- shipping cost for the selected country ----------
     The country comes from the same selector that drives the currency, so the
     shown shipping tracks it: Colombia -> the flat domestic COP; a country in a
     zone -> that zone's flat in the visitor's currency + its duties note;
     otherwise a neutral "calculated at checkout". Display only — never touches
     the checkout routing. */
  function zoneForCountry(cc) {
    var zones = (shipCfg && shipCfg.zones) || {};
    for (var k in zones) {
      if (!Object.prototype.hasOwnProperty.call(zones, k)) continue;
      if ((zones[k].countries || []).indexOf(cc) !== -1) return zones[k];
    }
    return null;
  }

  function shipCostFor(country) {
    var lang = LVCK.getLang() || "es";
    if (!shipCfg) return { served: false };
    var cc = String(country || "CO").toUpperCase();
    if (cc === "CO") {
      // charge currency is COP (Bold); the shipping is a literal flat, not rounded
      var flat = Number(shipCfg.domestic && shipCfg.domestic.flatCOP) || 0;
      return { served: true, kind: "CO", shipCOP: flat, costStr: LVCK.fmtCOP(flat, lang), etaStr: LVCK.t("prod.ship.eta", lang), whatsapp: true };
    }
    var z = zoneForCountry(cc);
    if (z && z.flatUSD != null) {
      // zones charge in USD; costStr converts it to the visitor's currency
      return {
        served: true, kind: "USD", shipUSD: Number(z.flatUSD),
        costStr: LVCK.money(Number(z.flatUSD), lang),
        etaStr: null,
        noteStr: (z.note && (z.note[lang] || z.note.es)) || null
      };
    }
    return { served: false };
  }

  function refreshShipping() {
    var lang = LVCK.getLang() || "es";
    // getSelectedCountry() returns the country object {n,c,cur}; we want its ISO2
    var sel = LVCK.getSelectedCountry ? LVCK.getSelectedCountry() : null;
    var country = sel ? (typeof sel === "string" ? sel : sel.c) : "CO";
    var info = shipCostFor(country);
    var label = LVCK.t("ship.shippingLbl", lang); // "Envío"

    var lineText = document.getElementById("ship-line-text");
    var line = document.getElementById("ship-line");
    if (line && lineText) {
      line.hidden = false;
      lineText.innerHTML = "";
      if (info.served) {
        lineText.appendChild(document.createTextNode(label + ": "));
        var b = document.createElement("b"); b.textContent = info.costStr;
        lineText.appendChild(b);
        if (info.etaStr) lineText.appendChild(document.createTextNode(" · " + info.etaStr));
      } else {
        lineText.textContent = LVCK.t("prod.ship.calc", lang);
      }
    }

    var fact = document.getElementById("ship-fact");
    if (fact) {
      fact.innerHTML = "";
      if (info.served) {
        var main = document.createElement("span");
        main.appendChild(document.createTextNode(label + ": "));
        var bb = document.createElement("b"); bb.textContent = info.costStr;
        main.appendChild(bb);
        fact.appendChild(main);
        if (info.etaStr) fact.appendChild(el("span", "ship-fact-eta", info.etaStr));
        if (info.whatsapp) fact.appendChild(el("span", "ship-fact-note", LVCK.t("dom.note", lang)));
        if (info.noteStr) fact.appendChild(el("span", "ship-fact-note", info.noteStr));
      } else {
        fact.textContent = LVCK.t("prod.ship.calc", lang);
      }
    }

    // keep the "Datos de envío" step in sync if it's open when the country changes
    if (document.getElementById("dom-totals")) refreshDomTotals();
  }

  /* ---------- language ---------- */

  // names, taglines, alts and prices come from shop-config.json, so they sit
  // outside the data-i18n sweep and are refreshed by hand
  function refreshDynamicCopy() {
    if (!product) return;
    var lang = LVCK.getLang() || "es";

    var pn = document.getElementById("pname");

      // other currency is a converted reference, so flag it.

      var isReference = cur !== "USD" && cur !== "COP";

  /* One-shot "this flame is a button" nudge, only the first time anyone opens a
     product page (remembered in localStorage). It wiggles the CTA — which at
     that point still says "Elige talla" — so a first-time visitor learns the
     tribal is interactive before they hunt for a size. Skipped if the visitor
     prefers reduced motion. */
  function ctaFirstVisitHint() {
    try { if (localStorage.getItem("ss-cta-hinted")) return; } catch (e) {}
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var buy = document.getElementById("buy");
    if (!buy) return;
    setTimeout(function () {
      try { localStorage.setItem("ss-cta-hinted", "1"); } catch (e) {}
      buy.classList.add("hint");
      buy.addEventListener("animationend", function done(ev) {
        if (ev.animationName !== "btnHint") return;   // ignore the float/breath loops
        buy.classList.remove("hint");
        buy.removeEventListener("animationend", done);
      });
    }, 1100);
  }

  /* ---------- international shipping (DORMANT until shipping-config.intlEnabled) ----------
     Collects the destination + address, quotes shipping via /api/quote, and routes
     the payment: Colombia -> the existing Bold flow (goBold); international -> the
     intl processor (not wired yet, shows "coming soon"). Built lazily, only ever
     reachable when the flag is on. */
  function openShip() { (document.getElementById("ship") || buildShipModal()).classList.add("open"); }
  function closeShip() { var m = document.getElementById("ship"); if (m) m.classList.remove("open"); }

  function shipVal(id) { var n = document.getElementById(id); return n ? n.value.trim() : ""; }
  function shipFmt(amount, currency) {
    if (currency === "COP") return LVCK.money(amount);
    return "$" + Number(amount).toFixed(2) + " " + (currency || "USD");
  }

  function buildShipModal() {
    var lang = LVCK.getLang() || "es";
    var sheet = el("div", "sheet ship-sheet"); sheet.id = "ship";
    var panel = el("div", "panel");
    var h3 = el("h3"); h3.setAttribute("data-i18n", "ship.title"); panel.appendChild(h3);
    var sub = el("p"); sub.setAttribute("data-i18n", "ship.sub"); panel.appendChild(sub);

    // country select: Colombia + every ENABLED international zone
    var cwrap = el("label", "ship-field");
    var clab = el("span"); clab.setAttribute("data-i18n", "ship.country"); cwrap.appendChild(clab);
    var sel = el("select", "ship-input"); sel.id = "ship-country";
    var opt0 = el("option", null, LVCK.t("ship.pickCountry")); opt0.value = ""; sel.appendChild(opt0);
    var oco = el("option", null, "Colombia"); oco.value = "CO"; sel.appendChild(oco);
    var zones = (shipCfg && shipCfg.zones) || {};
    Object.keys(zones).forEach(function (k) {
      var z = zones[k]; if (!z.enabled) return;
      var og = document.createElement("optgroup");
      og.label = (z.label && (z.label[lang] || z.label.es)) || k;
      (z.countries || []).forEach(function (cc) {
        var o = el("option", null, COUNTRY_NAMES[cc] || cc); o.value = cc; og.appendChild(o);
      });
      sel.appendChild(og);
    });
    cwrap.appendChild(sel); panel.appendChild(cwrap);

    [["ship.name", "ship-name"], ["ship.addr", "ship-addr"], ["ship.city", "ship-city"],
     ["ship.state", "ship-state"], ["ship.zip", "ship-zip"], ["ship.phone", "ship-phone"],
     ["ship.email", "ship-email"]].forEach(function (f) {
      var w = el("label", "ship-field");
      var l = el("span"); l.setAttribute("data-i18n", f[0]); w.appendChild(l);
      var i = el("input", "ship-input"); i.id = f[1];
      if (f[1] === "ship-email") i.type = "email";
      w.appendChild(i); panel.appendChild(w);
    });

    var calc = el("button", "lang-btn ship-calc"); calc.type = "button";
    calc.setAttribute("data-i18n", "ship.calc"); calc.addEventListener("click", quoteShip);
    panel.appendChild(calc);

    var result = el("div", "ship-result"); result.id = "ship-result"; result.hidden = true; panel.appendChild(result);

    var close = el("button", "btn close"); close.type = "button";
    LVCK.btnLabel(close).setAttribute("data-i18n", "p.close");
    close.addEventListener("click", closeShip); panel.appendChild(close);

    sheet.appendChild(panel);
    sheet.addEventListener("click", function (e) { if (e.target === sheet) closeShip(); });
    document.body.appendChild(sheet);
    LVCK.applyI18n(sheet);
    return sheet;
  }

  function quoteShip() {
    var country = shipVal("ship-country");
    var result = document.getElementById("ship-result");
    result.hidden = false; result.innerHTML = "";
    if (!country) { result.appendChild(el("p", "ship-warn", LVCK.t("ship.incomplete"))); return; }
    var address = {
      name: shipVal("ship-name"), address1: shipVal("ship-addr"), city: shipVal("ship-city"),
      state: shipVal("ship-state"), postalCode: shipVal("ship-zip"), phone: shipVal("ship-phone"),
      email: shipVal("ship-email"), country: country
    };
    result.appendChild(el("p", null, "…"));
    fetch("/api/quote", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product: product.slug, country: country, address: address, lang: LVCK.getLang() || "es" })
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        result.innerHTML = "";
        if (res.status !== 200) {
          result.appendChild(el("p", "ship-warn", res.body && res.body.error === "zone_unavailable" ? LVCK.t("ship.unavailable") : LVCK.t("ship.err")));
          return;
        }
        var b = res.body;
        var line = el("div", "ship-line");
        line.appendChild(el("span", null, LVCK.t("ship.shippingLbl")));
        line.appendChild(el("span", null, shipFmt(b.shipping, b.currency)));
        result.appendChild(line);
        if (b.note) result.appendChild(el("p", "ship-note", b.note));
        var pay = el("button", "rec-apply ship-pay"); pay.type = "button";
        pay.setAttribute("data-i18n", "ship.pay");
        pay.addEventListener("click", function () {
          if (country === "CO") { closeShip(); goBold(address); return; }  // Colombia -> Bold
          // international -> our checkout mints the intl processor order (PayPal),
          // then we send the buyer to its approve URL. Dormant until intlEnabled +
          // the keys exist (checkout answers 503 → "coming soon").
          result.innerHTML = ""; result.appendChild(el("p", null, "…"));
          fetch("/api/checkout", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              product: product.slug, size: chosen.slug, country: country, address: address,
              shippingAmount: b.shipping, shippingCurrency: b.currency, rateId: b.rateId || null
            })
          }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
            .then(function (res2) {
              if (res2.status === 200 && res2.body.url) { window.location.href = res2.body.url; return; }
              result.innerHTML = ""; result.appendChild(el("p", "ship-note", LVCK.t("ship.soon")));
            })
            .catch(function () { result.innerHTML = ""; result.appendChild(el("p", "ship-warn", LVCK.t("ship.err"))); });
        });
        result.appendChild(pay);
        LVCK.applyI18n(result);
      })
      .catch(function () { result.innerHTML = ""; result.appendChild(el("p", "ship-warn", LVCK.t("ship.err"))); });
  }

  /* ---------- domestic short step (Colombia): name + city + WhatsApp ----------
     Bold doesn't hand us a usable shipping address, so we take the minimum to
     dispatch and confirm the exact address by WhatsApp later. Shows the real COP
     breakdown (product + flat shipping) since that's what Bold charges. */
  function openDom() { (document.getElementById("dom") || buildDomModal()).classList.add("open"); refreshDomTotals(); }
  function closeDom() { var m = document.getElementById("dom"); if (m) m.classList.remove("open"); }

  function domRow(box, labelKey, valStr, strong) {
    var line = el("div", "ship-line");
    if (strong) line.style.fontWeight = "600";
    line.appendChild(el("span", null, LVCK.t(labelKey)));
    line.appendChild(el("span", null, valStr));
    box.appendChild(line);
  }

  // Breakdown shown in the "Datos de envío" step. It mirrors the product page:
  // product + shipping + total for the SELECTED country/currency (so the shipping
  // price here matches the line under the price). Colombia charges COP; a zone
  // charges USD converted to the visitor's currency; an unserved country shows the
  // product and a "calculado al finalizar" shipping line (no total).
  function refreshDomTotals() {
    var box = document.getElementById("dom-totals"); if (!box) return;
    var lang = LVCK.getLang() || "es";
    box.innerHTML = "";
    var sel = LVCK.getSelectedCountry ? LVCK.getSelectedCountry() : null;
    var country = sel ? (typeof sel === "string" ? sel : sel.c) : "CO";
    var info = shipCostFor(country);
    var usd = activeUsd(product);

    if (info.kind === "CO") {
      var prodCOP = LVCK.copFromUsd ? LVCK.copFromUsd(usd) : null;
      if (prodCOP != null) {
        domRow(box, "dom.product", LVCK.fmtCOP(prodCOP, lang));
        domRow(box, "ship.shippingLbl", LVCK.fmtCOP(info.shipCOP, lang));
        domRow(box, "ship.totalLbl", LVCK.fmtCOP(prodCOP + info.shipCOP, lang), true);
      } else {
        // rates not loaded yet — still show the flat shipping line
        domRow(box, "ship.shippingLbl", LVCK.fmtCOP(info.shipCOP, lang));
      }
    } else if (info.kind === "USD") {
      domRow(box, "dom.product", LVCK.money(usd, lang));
      domRow(box, "ship.shippingLbl", LVCK.money(info.shipUSD, lang));
      domRow(box, "ship.totalLbl", LVCK.money(usd + info.shipUSD, lang), true);
    } else {
      // no shipping rate for this country — show product and a neutral note
      domRow(box, "dom.product", LVCK.money(usd, lang));
      domRow(box, "ship.shippingLbl", LVCK.t("prod.ship.calc", lang));
    }
  }

  function buildDomModal() {
    var sheet = el("div", "sheet dom-sheet"); sheet.id = "dom";
    var panel = el("div", "panel");
    var h3 = el("h3"); h3.setAttribute("data-i18n", "dom.title"); panel.appendChild(h3);
    var sub = el("p"); sub.setAttribute("data-i18n", "dom.sub"); panel.appendChild(sub);

    [["ship.name", "dom-name", "text"], ["ship.city", "dom-city", "text"], ["dom.whatsapp", "dom-wa", "tel"]]
      .forEach(function (f) {
        var w = el("label", "ship-field");
        var l = el("span"); l.setAttribute("data-i18n", f[0]); w.appendChild(l);
        var i = el("input", "ship-input"); i.id = f[1]; i.type = f[2];
        if (f[1] === "dom-wa") i.setAttribute("inputmode", "tel");
        w.appendChild(i); panel.appendChild(w);
      });

    var totals = el("div", "dom-totals"); totals.id = "dom-totals"; panel.appendChild(totals);
    var note = el("p", "ship-note"); note.setAttribute("data-i18n", "dom.note"); panel.appendChild(note);
    var warn = el("p", "ship-warn"); warn.id = "dom-warn"; warn.hidden = true; panel.appendChild(warn);

    var pay = el("button", "rec-apply dom-pay"); pay.type = "button";
    pay.setAttribute("data-i18n", "ship.pay");
    pay.addEventListener("click", function () {
      var name = (document.getElementById("dom-name").value || "").trim();
      var city = (document.getElementById("dom-city").value || "").trim();
      var wa = (document.getElementById("dom-wa").value || "").trim();
      var warnEl = document.getElementById("dom-warn");
      if (!name || !city || !wa) { warnEl.hidden = false; warnEl.textContent = LVCK.t("dom.incomplete"); return; }
      closeDom();
      goBold({ name: name, city: city, whatsapp: wa, country: "CO" });
    });
    panel.appendChild(pay);

    var close = el("button", "btn close"); close.type = "button";
    LVCK.btnLabel(close).setAttribute("data-i18n", "p.close");
    close.addEventListener("click", closeDom); panel.appendChild(close);

    sheet.appendChild(panel);
    sheet.addEventListener("click", function (e) { if (e.target === sheet) closeDom(); });
    document.body.appendChild(sheet);
    LVCK.applyI18n(sheet);
    return sheet;
  }

  /* ---------- boot ---------- */

  function renderMissing() {
    var box = el("div", "missing");
    var p = el("p");
    p.setAttribute("data-i18n", "p.notFound");
    box.appendChild(p);
    var back = el("a", "btn");
    back.href = "shop.html";
    LVCK.btnLabel(back).setAttribute("data-i18n", "btn.back");
    back.style.marginTop = "24px";
    box.appendChild(back);
    wrap.appendChild(box);
    LVCK.applyI18n(wrap);
  }

  // shipping/international config — optional, non-blocking. If it fails to load,
  // shipCfg stays null and the storefront runs Colombia-only (current behaviour).
  fetch("shipping-config.json")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (c) { shipCfg = c; if (product) refreshShipping(); })
    .catch(function () {});

  fetch("shop-config.json")
    .then(function (r) { return r.json(); })
    .then(function (config) {
      allProducts = config.products || [];
      shopConfig = config;
      postLaunch = !!config.postLaunch;
      var slug = param("p");
      product = allProducts.filter(function (p) { return p.slug === slug; })[0] || null;

      if (!product) return renderMissing();

      var crumb = el("a", "crumb");
      crumb.href = "shop.html";
      crumb.setAttribute("data-i18n", "nav.back");
      wrap.appendChild(crumb);

      var row = el("div", "product");
      row.appendChild(buildGallery());
      row.appendChild(buildInfo());
      wrap.appendChild(row);
      document.body.appendChild(buildGuide());
      document.body.appendChild(buildRec());

      buildSetModule();
      LVCK.applyI18n();
      refreshDynamicCopy();
      LVCK.initReveal();
      ctaFirstVisitHint();

      return fetch("/api/stock")
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) { stock = data; applyStock(); })
        .catch(function () { applyStock(); });   // unknown stock: leave sizes buyable
    })
    .catch(renderMissing);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeGuide(); closeRec(); closeShip(); }
  });

  window.addEventListener("lvck:lang", refreshDynamicCopy);
  window.addEventListener("lvck:currency", refreshDynamicCopy);
  LVCK.boot();
})();
</script>
<script src="music.js"></script>
</body>
</html>
