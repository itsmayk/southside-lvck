</script>
<meta name="theme-color" content="#F5F5F0">
<script>
  (function () {
    try {
      var t = localStorage.getItem("ss-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "dark" ? "#232320" : "#F5F5F0");
    } catch (e) {}
  })();
</script>

<style>
  /* ===== About — year index. Only the years for now; each opens its own
     chapter later (tap the number). ===== */
  .about {
    position: relative;
    overflow: hidden;                 /* holds the grain layer */
    min-height: calc(100dvh - 168px); /* fill the screen under the topbar */
    display: flex; align-items: center;
    padding: clamp(48px, 12vh, 120px) 0;
  }
  .about-inner {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 940px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 44px);
  }

  .years { display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1.6vh, 16px); }
  /* big outlined numerals (same treatment as the old chapter numbers) that fill
     in on hover/tap; they're buttons, ready to open each year's story later */
  .year {
    appearance: none; -webkit-appearance: none; background: none; border: 0;
    padding: clamp(4px, 1vh, 10px) 12px; cursor: pointer;
    font-family: 'Cinzel', serif; font-weight: 700; line-height: 0.95;
    font-size: clamp(52px, 15vw, 150px); letter-spacing: 0.02em;
    color: transparent;
    -webkit-text-stroke: 1.4px var(--pearl); text-stroke: 1.4px var(--pearl);
    -webkit-tap-highlight-color: transparent;
    opacity: 0; transform: translateY(26px);
    transition: color 0.4s var(--ease), -webkit-text-stroke-color 0.4s var(--ease),
                transform 0.5s var(--ease), opacity 0.7s var(--ease);
  }
  /* the combined range is ~2x the characters, so scale it down to sit in line */
  .year-range { font-size: clamp(34px, 9.5vw, 96px); }
  .about.in .year { opacity: 1; transform: translateY(0); }
  .about.in .year:nth-child(1) { transition-delay: 0.05s; }
  .about.in .year:nth-child(2) { transition-delay: 0.13s; }
  .about.in .year:nth-child(3) { transition-delay: 0.21s; }
  .about.in .year:nth-child(4) { transition-delay: 0.29s; }
  .year:hover, .year:focus-visible {
    color: var(--ink); -webkit-text-stroke-color: var(--ink);
    transform: translateY(-2px) scale(1.015); outline: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .year { opacity: 1; transform: none; transition: color 0.3s var(--ease); }
  }
</style>
</head>
<body>

<div class="topbar glass">
  <header class="site-head">
    <button type="button" class="menu-btn" data-open-menu aria-label="Menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="mark" href="shop.html" aria-label="LVCK">

    <span class="label" data-i18n="drop.label">Lanzamiento</span>
    <span class="clock"></span>
    <span class="date" data-i18n="drop.date">28 AGO 2026</span>

</div>

<main class="about">

  <div class="about-inner">
    <nav class="years" aria-label="Años">
      <button type="button" class="year" data-year="2026">2026</button>
      <button type="button" class="year" data-year="2024">2024</button>
      <button type="button" class="year" data-year="2023">2023</button>
      <button type="button" class="year year-range" data-year="2022-2021">2022–2021</button>

    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.4v2.6M12 19v2.6M4.4 12H1.8M22.2 12h-2.6M6.4 6.4 4.6 4.6M19.4 19.4l-1.8-1.8M17.6 6.4l1.8-1.8M4.6 19.4l1.8-1.8"/>
  </svg>

  </svg>
</button>

<script>

  document.querySelectorAll(".year").forEach(function (y) {
